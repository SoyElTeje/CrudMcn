version: "3.9"

services:
  # Aplicación ABM McN
  # NOTA: La base de datos SQL Server debe existir previamente en producción
  # Configura las variables DB_SERVER, DB_USER, DB_PASSWORD, DB_DATABASE
  # para conectarte a tu servidor SQL Server existente
  abmmcn-app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Configurar la URL del backend para el frontend
        # IMPORTANTE: Ajustar según tu configuración
        # Esta debe ser la URL donde los usuarios accederán al backend
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:3001}
    container_name: abmmcn-app
    ports:
      - "${APP_PORT:-3001}:3001"
    environment:
      # Base de datos (SQL Server existente en producción)
      # Configurar con los datos de tu servidor SQL Server existente
      DB_SERVER: ${DB_SERVER}
      DB_PORT: ${DB_PORT:-1433}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_DATABASE: ${DB_DATABASE}

      # Servidor
      PORT: ${PORT:-3001}
      NODE_ENV: production

      # CORS
      # Configurar con los orígenes permitidos (separados por coma)
      # Ejemplo: http://localhost:5173,https://tudominio.com
      CORS_ORIGIN: ${CORS_ORIGIN:-*}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-24h}

      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # Trial (opcional)
      TRIAL_DB: ${TRIAL_DB:-}
      TRIAL_TABLE: ${TRIAL_TABLE:-}
    volumes:
      # Persistir uploads y logs
      - ./backend/uploads:/app/backend/uploads
      - ./logs:/app/logs
    restart: unless-stopped
    # Health check para verificar que la aplicación está funcionando
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:3001/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
